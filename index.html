  <style>
    /* ── PWA / Mobile shell ── */
    html { height: 100%; background: #f4f7fb; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      background: #f4f7fb;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    input, select, textarea { font-size: 16px !important; }
    button { min-height: 40px; }
    .bsm { min-height: 34px !important; }
    #app-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.5rem 0.75rem;
    }
    #install-banner {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #185FA5;
      color: #fff;
      padding: 14px 16px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 9999;
      font-size: 14px;
      font-weight: 600;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    }
    #install-banner span { flex: 1; line-height: 1.4; }
    #install-banner button {
      background: #fff;
      color: #185FA5;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px;
      white-space: nowrap;
    }
    #install-dismiss {
      background: transparent !important;
      color: #85B7EB !important;
      padding: 8px 6px !important;
      font-size: 20px !important;
    }
    #offline-bar {
      display: none;
      background: #EF9F27;
      color: #633806;
      text-align: center;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #B5D4F4; border-radius: 4px; }
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --color-text-primary: #1a1a1a;
      --bg: #f4f7fb;
      --bg-card: #ffffff;
      --bg-sec: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #dde4ee;
      --topbar-bg: #185FA5;
      --input-bg: #ffffff;
      --input-border: #c8d6e5;
      --table-head: #E6F1FB;
      --table-stripe: #f7fafd;
      --shadow: 0 2px 10px rgba(24,95,165,0.07);
    }
    html.dark {
      --bg: #0f1117;
      --bg-card: #1a1f2e;
      --bg-sec: #1a1f2e;
      --text: #e8eaf0;
      --text-muted: #9aa3b8;
      --border: #2d3548;
      --topbar-bg: #0c3060;
      --input-bg: #242938;
      --input-border: #3a4460;
      --table-head: #1e2740;
      --table-stripe: #1e2535;
      --shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    html.dark body { background: var(--bg); color: var(--text); }
    html.dark .sec { background: var(--bg-sec); border-color: var(--border); }
    html.dark input, html.dark select, html.dark textarea {
      background: var(--input-bg) !important;
      border-color: var(--input-border) !important;
      color: var(--text) !important;
    }
    html.dark table thead tr { background: var(--table-head); }
    html.dark .topbar { background: var(--topbar-bg) !important; }
    html.dark .lwrap { background: var(--bg-card); border-color: var(--border); }
    html.dark .modal { background: var(--bg-card); color: var(--text); }
    html.dark .mk { background: var(--bg-card); border-color: var(--border); }
    html.dark .crow { border-bottom-color: var(--border); }
    html.dark .idle-box { background: var(--bg-card); }
    html.dark .rzone { background: #2a1515; border-color: #5a2020; }
    html.dark .alert.ain { background: #1a2a3a; border-color: #2d4a6a; color: #85B7EB; }
    html.dark .alert.aok { background: #0d2a1a; border-color: #1a5a30; color: #5dba85; }
    html.dark .alert.awn { background: #2a1f0a; border-color: #5a3f10; color: #d4a040; }
    html.dark .alert.aer { background: #2a0f0f; border-color: #5a1a1a; color: #e07070; }
    html.dark .sh { border-bottom-color: var(--border); }
    html.dark .tabs { background: var(--bg-card); border-color: var(--border); }
    html.dark .tab { color: var(--text-muted); }
    html.dark .tab.on { background: #185FA5; color: #fff; }
    html.dark .tw table tr:nth-child(even) { background: var(--table-stripe); }
    html.dark #app-shell { background: var(--bg); }
    html.dark html, html.dark body { background: var(--bg) !important; }
  </style>
</head>

<div id="offline-bar">⚡ You are offline — MediTrack is running from cache</div>

<div id="pzone" style="display:none"></div>

<div id="install-banner">
  <span>📱 Install MediTrack on your device for faster access</span>
  <button id="install-btn">Install App</button>
  <button id="install-dismiss" style="">✕</button>
</div>

<div id="app-shell">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:15px;color:var(--color-text-primary);background:transparent}
.app{padding:1rem 0;min-height:600px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#185FA5;border-radius:12px;margin-bottom:.85rem;flex-wrap:wrap}
.tlogo{width:38px;height:38px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#185FA5;flex-shrink:0}
.tname{color:#E6F1FB;font-size:17px;font-weight:700}
.tsub{color:#85B7EB;font-size:13px;font-weight:500}
.idle-txt{display:none}
.sw{position:relative;flex:1;min-width:180px;max-width:340px}
.sw input{width:100%;padding:9px 34px 9px 34px;border:1.5px solid #378ADD;border-radius:8px;background:rgba(255,255,255,0.18);color:#fff;font-size:14px;font-weight:500}
.sw input:focus{outline:none;border-color:#E6F1FB;background:rgba(255,255,255,0.28)}
.sw input::placeholder{color:#85B7EB}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#85B7EB;font-size:14px;pointer-events:none}
.sx{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#85B7EB;cursor:pointer;font-size:15px;line-height:1;padding:0}
.sx:hover{color:#fff}
.sdrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1.5px solid #B5D4F4;border-radius:10px;z-index:9999;box-shadow:0 8px 28px rgba(24,95,165,.2);overflow:hidden;max-height:300px;overflow-y:auto}
.sdi{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0f4f8;gap:8px}
.sdi:last-child{border-bottom:none}
.sdi:hover{background:#E6F1FB}
.sdn{font-size:14px;font-weight:600;color:#1a1a1a}
.sdm{font-size:12px;color:#666;margin-top:2px;font-weight:500}
.sdp{font-size:14px;font-weight:700;color:#185FA5}
.sdnone{padding:13px 14px;font-size:14px;color:#666;font-weight:500}
.spill{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.12);color:#9FE1CB;white-space:nowrap;font-weight:600}
.sdot{width:8px;height:8px;border-radius:50%;background:#1D9E75}
.sdot.blink{background:#EF9F27;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;gap:3px;margin-bottom:1rem;background:#E6F1FB;padding:4px;border-radius:8px;flex-wrap:wrap}
.tab{flex:1;min-width:80px;padding:8px 6px;border:none;border-radius:6px;background:transparent;color:#185FA5;font-size:13px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap}
.tab.on{background:#185FA5;color:#E6F1FB;font-weight:700}
.tab:hover:not(.on){background:#B5D4F4}
.tabs.stf{background:#E1F5EE}
.tabs.stf .tab{color:#0F6E56}
.tabs.stf .tab.on{background:#1D9E75;color:#E1F5EE}
.tabs.stf .tab:hover:not(.on){background:#9FE1CB}
.sec{background:#fff;border:1.5px solid rgba(0,0,0,.1);border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:1rem}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;padding-bottom:10px;border-bottom:2.5px solid #E6F1FB;gap:8px;flex-wrap:wrap}
.sh h3{font-size:16px;font-weight:700;color:#185FA5}
.sh.g{border-bottom-color:#E1F5EE}.sh.g h3{color:#0F6E56}
.sh.p{border-bottom-color:#EEEDFE}.sh.p h3{color:#3C3489}
.sh.o{border-bottom-color:#FAEEDA}.sh.o h3{color:#854F0B}
.mc4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1rem}
.mc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:1rem}
.mc2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:1rem}
.mk{border-radius:10px;padding:14px}
.mk.bl{background:#E6F1FB}.mk.bl .mv{color:#0C447C}.mk.bl .ml{color:#185FA5}
.mk.gn{background:#EAF3DE}.mk.gn .mv{color:#27500A}.mk.gn .ml{color:#3B6D11}
.mk.tl{background:#E1F5EE}.mk.tl .mv{color:#085041}.mk.tl .ml{color:#0F6E56}
.mk.rd{background:#FCEBEB}.mk.rd .mv{color:#791F1F}.mk.rd .ml{color:#A32D2D}
.mk.am{background:#FAEEDA}.mk.am .mv{color:#633806}.mk.am .ml{color:#854F0B}
.ml{font-size:13px;margin-bottom:4px;font-weight:600}
.mv{font-size:22px;font-weight:700}
.ms{font-size:12px;margin-top:3px;font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead tr{background:#E6F1FB}
.tg thead tr{background:#E1F5EE}
.tp thead tr{background:#EEEDFE}
.to thead tr{background:#FAEEDA}
th{text-align:left;font-weight:700;font-size:13px;color:#0C447C;padding:10px 11px;border-bottom:1.5px solid #B5D4F4}
.tg th{color:#085041;border-bottom-color:#9FE1CB}
.to th{color:#854F0B}
td{padding:9px 11px;border-bottom:1px solid #f0f0f0;vertical-align:middle;font-size:14px;font-weight:500}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;font-weight:700}
.trx{background:#FAECE7;color:#712B13}.totc{background:#EAF3DE;color:#27500A}
.tsu{background:#E1F5EE;color:#085041}.tlo{background:#FCEBEB;color:#791F1F}
.tok{background:#EAF3DE;color:#27500A}
.the{background:#E8F5E9;color:#1B5E20}.tsp{background:#EDE7F6;color:#4527A0}
.tam{background:#FEF3E2;color:#633806}
.tcos{background:#FCE4EC;color:#880E4F}.tmd{background:#E3F2FD;color:#0D47A1}.tsup{background:#F3E5F5;color:#6A1B9A}
.rm{background:#EEEDFE;color:#3C3489;font-size:12px;padding:3px 10px;border-radius:6px;font-weight:700}
.rs{background:#E1F5EE;color:#085041;font-size:12px;padding:3px 10px;border-radius:6px;font-weight:700}
.btn{padding:8px 16px;border:1.5px solid #ddd;border-radius:8px;background:#fff;color:#333;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:#f5f5f5}
.bbl{background:#185FA5;color:#fff;border-color:#185FA5}.bbl:hover{background:#0C447C}
.bgn{background:#3B6D11;color:#EAF3DE;border-color:#3B6D11}.bgn:hover{background:#27500A}
.btl{background:#1D9E75;color:#E1F5EE;border-color:#1D9E75}.btl:hover{background:#0F6E56}
.brd{background:#FCEBEB;color:#791F1F;border-color:#F09595}.brd:hover{background:#F7C1C1}
.bda{background:#E24B4A;color:#fff;border-color:#E24B4A}.bda:hover{background:#A32D2D}
.bam{background:#FAEEDA;color:#633806;border-color:#EF9F27}.bam:hover{background:#FAC775}
.bgr{background:#F1EFE8;color:#444;border-color:#ccc}.bgr:hover{background:#e0ded8}
.bpu{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}.bpu:hover{background:#CECBF6}
.bor{background:#FFF3E0;color:#854F0B;border-color:#FFB74D}.bor:hover{background:#FFE0B2}
.bsm{padding:5px 11px;font-size:13px}.bfw{width:100%}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:#444;margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid #ddd;border-radius:8px;background:#fff;color:#333;font-size:14px;font-weight:500}
.field textarea{resize:vertical;min-height:56px}
.hint{font-size:12px;color:#888;margin-top:3px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.ist{padding:7px 15px;border:1.5px solid #B5D4F4;border-radius:8px;background:transparent;color:#185FA5;font-size:13px;font-weight:700;cursor:pointer}
.ist.on{background:#185FA5;color:#fff;border-color:#185FA5}
.crow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0}
.crow:last-child{border-bottom:none}
.qc{display:flex;align-items:center;gap:7px}
.qc button{width:27px;height:27px;border:1.5px solid #ddd;border-radius:5px;background:#E6F1FB;cursor:pointer;font-size:16px;color:#0C447C;font-weight:700}
.qc span{min-width:24px;text-align:center;font-weight:700;font-size:15px}
.mwrap{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5000;padding:1rem}
.modal{background:#fff;border-radius:12px;padding:1.6rem;width:92%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:1rem;color:#185FA5}
.modal h3.g{color:#0F6E56}.modal h3.o{color:#854F0B}
.rrow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;font-weight:500}
.rtot{display:flex;justify-content:space-between;padding:9px 0;margin-top:7px;border-top:2px solid #B5D4F4;font-weight:700;font-size:16px;color:#0C447C}
.divider{height:1px;background:#eee;margin:11px 0}
.alert{padding:11px 15px;border-radius:8px;font-size:14px;margin-bottom:11px;font-weight:600}
.aok{background:#EAF3DE;color:#27500A;border:1.5px solid #97C459}
.aer{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595}
.awn{background:#FAEEDA;color:#633806;border:1.5px solid #EF9F27}
.ain{background:#E6F1FB;color:#0C447C;border:1.5px solid #85B7EB}
.lwrap{max-width:400px;margin:2rem auto;background:#fff;border:1.5px solid #ddd;border-radius:12px;padding:2.2rem}
.dlbl{background:#E6F1FB;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;color:#0C447C;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.dlbl.g{background:#E1F5EE;color:#085041}
.blog{background:#f8f8f8;border-radius:8px;padding:1rem;font-size:13px;font-family:monospace;max-height:240px;overflow-y:auto;color:#555;line-height:1.8;font-weight:500}
.rzone{border:2px dashed #F09595;border-radius:12px;padding:1.4rem;background:#FCEBEB}
.rzone h4{color:#791F1F;font-size:16px;font-weight:700;margin-bottom:7px}
.rzone p{color:#A32D2D;font-size:14px;margin-bottom:13px;line-height:1.6;font-weight:500}
.ro-badge{display:inline-flex;align-items:center;gap:5px;background:#EEEDFE;color:#3C3489;font-size:12px;padding:4px 10px;border-radius:6px;font-weight:700;margin-bottom:10px}
.idle-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,30,70,0.92);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.idle-box{background:#fff;border-radius:16px;padding:2.5rem 2rem;max-width:380px;width:90%;text-align:center}
.idle-box h2{font-size:20px;font-weight:800;color:#791F1F;margin-bottom:8px}
.idle-box p{font-size:14px;color:#555;font-weight:500;margin-bottom:1.2rem;line-height:1.6}
mark{background:#FFF3CD;color:inherit;border-radius:2px;padding:0 2px}
.toggle-wrap{cursor:pointer;user-select:none}
.toggle{width:50px;height:28px;border-radius:14px;background:#ccc;position:relative;transition:background .2s}
.toggle.on{background:#185FA5}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{left:25px}
.sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:4000;opacity:0;transition:opacity .25s;pointer-events:none}
.sidebar-overlay.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#185FA5;z-index:4001;transition:left .25s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.25)}
.sidebar.open{left:0}

<script>
/* ════════════════════════════════════════
   SESSION MANAGEMENT
════════════════════════════════════════ */
const IDLE_LIMIT   = 180;
const AWAY_LIMIT   = 300;

let idleSeconds  = 0;
let idleInterval = null;
let _awayStart   = null;

function resetIdle(){
  idleSeconds = 0;
  updateIdleBar();
}

function startIdleTimer(){
  clearInterval(idleInterval);
  idleSeconds = 0;
  idleInterval = setInterval(()=>{
    if(!D || !D.user) return;
    idleSeconds++;
    updateIdleBar();
    if(idleSeconds >= IDLE_LIMIT){
      clearInterval(idleInterval);
      triggerIdleLogout('No activity for 3 minutes');
    }
  }, 1000);
}

function stopIdleTimer(){
  clearInterval(idleInterval);
  idleSeconds = 0;
}

function updateIdleBar(){
  const bar = document.getElementById('idleBar');
  const txt = document.getElementById('idleTxt');
  if(!bar || !txt) return;
  const pct = Math.max(0, ((IDLE_LIMIT - idleSeconds) / IDLE_LIMIT) * 100);
  bar.style.width = pct + '%';
  const rem = IDLE_LIMIT - idleSeconds;
  const m = Math.floor(rem / 60);
  const s = rem % 60;
  txt.textContent = 'Session expires in ' + m + 'm ' + String(s).padStart(2,'0') + 's · move mouse to reset';
  bar.className = 'idle-bar' + (pct < 34 ? ' danger' : pct < 67 ? ' warn' : '');
}

function triggerIdleLogout(reason){
  if(!D || !D.user) return;
  addLog('Auto logout', reason + ' — ' + D.user.name);
  saveDB();
  stopIdleTimer();
  if(auth) auth.signOut();
  D.cart = []; D.searchQ = ''; D.showSearch = false;
  const overlay = document.getElementById('idle-overlay');
  const msg = document.getElementById('idle-msg');
  if(msg) msg.textContent = reason + '. Please sign in again.';
  if(overlay) overlay.style.display = 'flex';
  render();
}

function dismissIdle(){
  document.getElementById('idle-overlay').style.display = 'none';
  render();
}

['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>{
  document.addEventListener(ev, ()=>{ if(D && D.user) resetIdle(); }, {passive: true});
});

function handleVisibilityChange(){
  if(!D || !D.user) return;
  if(document.hidden){
    _awayStart = Date.now();
  } else {
    if(_awayStart !== null){
      const awaySeconds = Math.floor((Date.now() - _awayStart) / 1000);
      _awayStart = null;
      if(awaySeconds >= AWAY_LIMIT){
        triggerIdleLogout('Away from site for ' + Math.floor(awaySeconds/60) + ' min');
        return;
      }
    }
    resetIdle();
  }
}

document.addEventListener('visibilitychange', handleVisibilityChange);

window.addEventListener('blur', ()=>{
  if(D && D.user && _awayStart === null) _awayStart = Date.now();
});
window.addEventListener('focus', ()=>{
  if(!D || !D.user) return;
  if(_awayStart !== null){
    const awaySeconds = Math.floor((Date.now() - _awayStart) / 1000);
    _awayStart = null;
    if(awaySeconds >= AWAY_LIMIT){
      triggerIdleLogout('Away from site for ' + Math.floor(awaySeconds/60) + ' min');
      return;
    }
  }
  resetIdle();
});


/* ════════════════════════════════════════
   STATE + PERSISTENCE
════════════════════════════════════════ */
function getToday(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
Object.defineProperty(window,'TODAY',{get:()=>getToday()});

function scheduleReloadAtMidnight(){
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const msUntilMidnight = midnight - now;
  console.log('Auto reload scheduled in', Math.round(msUntilMidnight/60000), 'minutes');
  setTimeout(()=>{
    if(db && window._docRef) saveDB();
    setTimeout(()=>{ location.reload(); }, 1000);
  }, msUntilMidnight);
}
scheduleReloadAtMidnight();

function fmt12(date){
  let h=date.getHours(),m=date.getMinutes(),s=date.getSeconds();
  const ampm=h>=12?'PM':'AM';h=h%12||12;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' '+ampm;
}
function fmt12hm(date){
  let h=date.getHours(),m=date.getMinutes();
  const ampm=h>=12?'PM':'AM';h=h%12||12;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ampm;
}

function friendlyDate(dateStr){
  const [y,mo,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,mo-1,d);
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const ord=n=>{const s=['th','st','nd','rd'];const v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  return days[dt.getDay()]+' '+ord(d)+' '+months[mo-1]+' '+y;
}

function timeGreeting(){
  const h=new Date().getHours();
  if(h>=5&&h<12)return'Good morning';
  if(h>=12&&h<17)return'Good afternoon';
  return'Good evening';
}

const ts=()=>TODAY+' '+fmt12(new Date());
const hm=()=>fmt12hm(new Date());

const DEF_INV=[];
const DEF_TXN=[];

let USERS=[];

/* ════════════════════════════════════════
   FIREBASE FIRESTORE — REAL-TIME SYNC
════════════════════════════════════════ */
let db = null;
let auth = null;
let _unsubscribe = null;
let _unsubscribeAccounts = null;

// SAFETY GUARD: becomes true only once we've genuinely received the real
// pharmacy data from Firestore (or confirmed the document is brand new and
// we're deliberately initializing it). Every write path (saveDB) checks
// this before touching the cloud. Without this guard, any code that calls
// autoSave()/saveNow() — like the login handler — could fire before the
// real-time listener's first snapshot has arrived, and silently overwrite
// real inventory/transactions/suppliers in Firestore with the empty local
// defaults. This is exactly what happened when logging in on a device that
// hadn't yet pulled the latest cloud data.
let _cloudSynced = false;

const DEF_SUPPLIERS = [];

const D={
  user:null,tab:'dashboard',invTab:'add',
  inventory:[],
  transactions:[],
  logins:[],
  log:[],
  suppliers:[],
  nextId:1,nextTxn:1,nextSup:1,
  cart:[],searchQ:'',showSearch:false,
  alert:null,receipt:null,editItem:null,filterDate:'',
  forgotMode:false,forgotStep:1,forgotUser:'',forgotSecOk:false,
  newMed:{name:'',type:'OTC / General',price:'',qty:'',minQty:'',supplier:'',expiry:'',notes:''},
  dupWarn:false,saveStatus:'saved',lastSaved:'—',_t:null,
  supTab:'list',editSup:null,
  newSup:{name:'',phone:'',email:'',location:''},
  dbLoaded:false,
  voidTxn:null,
  pharmacy:{name:"God's Will OTC",address:'',phone:'',email:''},
  darkMode: (localStorage.getItem('mt_dark')==='1'),
  reportDate: '',
  invTypeFilter: 'Cosmetics',
  showResetDialog: false,
  resetStep: 1,
  blockedUsers: [],
  sidebarOpen: false,
};

function pill(){
  const e=document.getElementById('spill');if(!e)return;
  e.innerHTML=D.saveStatus==='saving'?'<span class="sdot blink"></span>Saving…':D.saveStatus==='error'?'<span class="sdot" style="background:#E24B4A"></span>Sync error':`<span class="sdot"></span>Synced ${D.lastSaved}`;
}
function addLog(a,d=''){D.log.unshift({ts:ts(),action:a,detail:d,user:D.user?D.user.name:'System'});if(D.log.length>600)D.log.length=600;}

function saveDB(retries=3){
  if(!db) return;
  // ══════════════════════════════════════════════════════════════
  // CRITICAL SAFETY GUARD — do not remove.
  // Never let a full save fire before we've received the real cloud
  // data at least once this session. Without this guard, any save
  // triggered in that early window (e.g. right after login, before
  // the Firestore listener's first snapshot has arrived — which is
  // slower on mobile networks) would overwrite the ENTIRE document
  // with whatever is still sitting in local memory, which at that
  // point is just the empty default state. That silently wiped real
  // inventory/transactions/suppliers data in production. If a save
  // is requested before data has loaded, queue it and it will fire
  // automatically the moment the first real snapshot arrives (see
  // attachDataListeners()'s onSnapshot handler).
  // ══════════════════════════════════════════════════════════════
  if(!_cloudSynced){
    console.warn('saveDB() deferred: real cloud data has not loaded yet, refusing to write until it does');
    D._pendingSaveAfterLoad = true;
    D.saveStatus='saving'; pill();
    return;
  }
  const payload = {
    inventory:D.inventory,
    transactions:D.transactions,
    logins:D.logins,
    log:D.log,
    suppliers:D.suppliers,
    nextId:D.nextId,
    nextTxn:D.nextTxn,
    nextSup:D.nextSup,
    pharmacy:D.pharmacy,
    blockedUsers:D.blockedUsers||[],
    updatedAt: Date.now(),
  };
  window._docRef.set(payload)
    .then(()=>{ D.lastSaved=hm(); D.saveStatus='saved'; pill(); })
    .catch(e=>{
      console.error('Firestore save error',e);
      if(retries>0){
        const delay=(4-retries)*1000;
        setTimeout(()=>saveDB(retries-1), delay);
      } else {
        D.saveStatus='error'; pill();
      }
    });
}

function saveAccountsUrgent(){
  if(!db) return;
  if(!_cloudSynced){
    console.warn('saveAccountsUrgent() deferred: real cloud data has not loaded yet');
    D._pendingSaveAfterLoad = true;
    D.saveStatus='saving'; pill();
    return;
  }
  window._docRef.update({
    blockedUsers: D.blockedUsers||[],
    updatedAt: Date.now(),
  })
  .then(()=>{ D.lastSaved=hm(); D.saveStatus='saved'; pill(); })
  .catch(e=>{
    console.warn('Urgent update failed, falling back to full save:', e.message);
    saveDB();
  });
}

function autoSave(){
  D.saveStatus='saving'; pill();
  clearTimeout(D._t);
  D._t=setTimeout(()=>{ saveDB(); },800);
}

function saveNow(){
  clearTimeout(D._t);
  D.saveStatus='saving'; pill();
  saveDB();
}

function applyCloudData(data){
  if(!data) return;
  const has = k => Object.prototype.hasOwnProperty.call(data, k);
  if(has('inventory'))    D.inventory    = data.inventory    || [];
  if(has('transactions')) D.transactions = data.transactions || [];
  if(has('logins'))       D.logins       = data.logins       || [];
  if(has('log'))          D.log          = data.log          || [];
  if(has('suppliers'))    D.suppliers    = data.suppliers    || [];
  if(has('nextId'))       D.nextId       = data.nextId       || 1;
  if(has('nextTxn'))      D.nextTxn      = data.nextTxn      || 1;
  if(has('nextSup'))      D.nextSup      = data.nextSup      || 1;
  if(has('pharmacy'))     D.pharmacy     = data.pharmacy     || D.pharmacy;
  D.blockedUsers = data.blockedUsers || [];
  D.lastSaved = hm();
  D.saveStatus = 'saved';
  if(D.user){
    const isBlocked = D.blockedUsers.includes(D.user.uid);
    if(isBlocked){
      stopIdleTimer();
      D.user = null; D.cart = []; D.searchQ = ''; D.showSearch = false;
      const overlay = document.getElementById('idle-overlay');
      const msg     = document.getElementById('idle-msg');
      const ttl     = document.getElementById('idle-title');
      if(msg) msg.textContent = 'Your account has been suspended by the Manager.';
      if(ttl) ttl.textContent = '🚫 Account Suspended';
      if(overlay) overlay.style.display = 'flex';
      if(auth) auth.signOut();
      render();
      return;
    }
  }
}

function showLoadingScreen(){
  document.getElementById('root').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:18px">
      <div style="width:60px;height:60px;border-radius:50%;background:#185FA5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800">M</div>
      <div style="font-size:18px;font-weight:700;color:#185FA5">God's Will OTC</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="width:10px;height:10px;border-radius:50%;background:#185FA5;animation:ping .9s ease-in-out infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#185FA5;animation:ping .9s ease-in-out .3s infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#185FA5;animation:ping .9s ease-in-out .6s infinite"></div>
      </div>
      <div style="font-size:14px;color:#888;font-weight:500">Connecting to cloud…</div>
      <style>@keyframes ping{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}</style>
    </div>`;
}

let _scanStream = null;
let _scanInterval = null;

function addToCart(id){
  const inv=D.inventory.find(i=>i.id===id);if(!inv||inv.qty<=0)return;
  const c=D.cart.find(c=>c.id===id);
  if(c){if(c.qty<inv.qty)c.qty++;}
  else D.cart.push({id:inv.id,name:inv.name,price:inv.price,qty:1});
}

async function openBarcodeScanner(){
  const modal=document.getElementById('barcodeModal');
  if(!modal)return;
  modal.style.display='flex';
  const video=document.getElementById('barcodeVideo');
  try{
    _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    if(video){video.srcObject=_scanStream;video.play();}
    if('BarcodeDetector' in window){
      const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});
      _scanInterval=setInterval(async()=>{
        if(!video||video.readyState<2)return;
        try{
          const barcodes=await detector.detect(video);
          if(barcodes.length){
            const code=barcodes[0].rawValue;
            const item=D.inventory.find(i=>i.barcode===code||i.name.toLowerCase()===code.toLowerCase());
            if(item){addToCart(item.id);closeBarcodeScanner();showAlert(item.name+' added to cart!','ok');render();}
            else{
              const bsearch=document.getElementById('barcodeSearch');
              if(bsearch)bsearch.value=code;
            }
          }
        }catch(e){}
      },500);
    }
  }catch(e){
    modal.style.display='none';
    showAlert('Camera access denied. Use the search box instead.','aw');render();
  }
}

function closeBarcodeScanner(){
  const modal=document.getElementById('barcodeModal');
  if(modal)modal.style.display='none';
  if(_scanStream){_scanStream.getTracks().forEach(t=>t.stop());_scanStream=null;}
  if(_scanInterval){clearInterval(_scanInterval);_scanInterval=null;}
  const video=document.getElementById('barcodeVideo');
  if(video){video.srcObject=null;}
}

function initFirebase(){
  const firebaseConfig = {
    apiKey: "AIzaSyBLFI8yzmsXCwm3c2qRrN674TH3ScC0hrY",
    authDomain: "godswillotc-v2.firebaseapp.com",
    projectId: "godswillotc-v2",
    storageBucket: "godswillotc-v2.firebasestorage.app",
    messagingSenderId: "155315998608",
    appId: "1:155315998608:web:01ccd0d778c08a3e05ed15"
  };

  window._firebaseConfig = firebaseConfig;
  const fbApp = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(fbApp);
  auth = firebase.auth(fbApp);
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
  window._docRef = db.collection('pharmacy').doc('data');
  window._accountsRef = db.collection('accounts');

  // ── Data listeners are only safe to attach once we know the user is
  // authenticated (Firestore rules require it). Attaching them at page
  // load — before login finishes — causes a permission-denied error that
  // permanently kills the listener and silently falls back to defaults,
  // even after the user successfully logs in. So these are (re)attached
  // from inside onAuthStateChanged below instead of at the top level. ──
  function attachDataListeners(){
    if(_unsubscribe){ _unsubscribe(); _unsubscribe=null; }
    if(_unsubscribeAccounts){ _unsubscribeAccounts(); _unsubscribeAccounts=null; }

    _unsubscribeAccounts = window._accountsRef.onSnapshot(qs=>{
      USERS = qs.docs.map(d=>({uid:d.id, ...d.data()}));
      if(D.dbLoaded) render();
    }, err=>{
      console.error('Accounts listener error:', err);
    });

    _unsubscribe = window._docRef.onSnapshot(snap => {
      // Mark _cloudSynced BEFORE deciding what to do with the snapshot —
      // by this point we have a definitive, authenticated read of the
      // cloud state (either real data, or a confirmed-empty/new
      // document), so it's now safe for saveDB() to write. This is a
      // SEPARATE flag from D.dbLoaded on purpose: D.dbLoaded also gets
      // set true while logged out just to dismiss the loading spinner
      // and show the login screen, which happens before any real data
      // has been read. Using D.dbLoaded as the write-safety check would
      // (and did) let saveDB() fire before real cloud data ever loaded.
      const firstLoad = !D.dbLoaded;
      D.dbLoaded = true;
      _cloudSynced = true;

      if(snap.exists){
        applyCloudData(snap.data());
      } else {
        console.log('No Firestore data — writing defaults…');
        saveDB();
      }

      if(firstLoad){
        render();
      } else {
        if(!D.receipt && !D.editItem && !D.editSup && !D.showResetDialog){
          render();
        } else {
          pill();
        }
      }

      // If something tried to save earlier while we were still waiting
      // to confirm real cloud state (e.g. login fired autoSave() before
      // this snapshot arrived), run that save now instead of dropping it.
      if(D._pendingSaveAfterLoad){
        D._pendingSaveAfterLoad = false;
        saveDB();
      }
    }, err => {
      console.error('Firestore listener error:', err);
      D.saveStatus = 'error';
      // Don't mark dbLoaded / render defaults here — a permission error
      // usually just means auth hasn't finished yet. Once login completes,
      // onAuthStateChanged will call attachDataListeners() again.
      pill();
    });
  }

  showLoadingScreen();

  auth.onAuthStateChanged(fbUser=>{
    if(fbUser){
      window._accountsRef.doc(fbUser.uid).get().then(doc=>{
        if(!doc.exists){
          console.warn('No account record for uid', fbUser.uid);
          auth.signOut();
          return;
        }
        const acc = doc.data();
        if((D.blockedUsers||[]).includes(fbUser.uid)){
          auth.signOut();
          showAlert('This account has been suspended by the Manager.','er');
          render();
          return;
        }
        D.user = {uid:fbUser.uid, email:fbUser.email, name:acc.name, role:acc.role};
        D.tab = D.tab==='login'?'dashboard':D.tab;
        if(!D._justLoggedIn){ D._justLoggedIn=true; }
        // Now that we're authenticated, (re)connect the real-time data
        // listeners. This runs every time someone logs in, so a fresh
        // page load + login always gets a clean, working listener.
        attachDataListeners();
        render();
      }).catch(e=>{
        console.error('Could not load account record:', e);
        auth.signOut();
      });
    } else {
      D.user = null;
      // Signed out — no authenticated listener needed. If a Manager wants
      // to browse without logging in this stays blank, which is expected.
      if(!D.dbLoaded){ D.dbLoaded = true; }
      // Require a fresh, confirmed cloud read before the NEXT login is
      // allowed to write anything — closes the exact race that wiped
      // data when logging in on a device before its listener had synced.
      _cloudSynced = false;
      render();
    }
  });
}

let alertT=null;
function showAlert(msg,k='ok'){D.alert={msg,k};clearTimeout(alertT);alertT=setTimeout(()=>{D.alert=null;render();},4500);}
const cur=n=>'GH₵ '+parseFloat(n).toFixed(2);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MEDICINE_TYPES=['Cosmetics','OTC','Herbal','Prescription','Consumable','Medical Device','Supplement'];

function typeTag(t){
  const m={
    'Cosmetics':'tcos','OTC':'totc','Herbal':'the',
    'Prescription':'trx','Consumable':'tsu',
    'Medical Device':'tmd','Supplement':'tsup',
    'OTC / General':'totc','Prescription (POM)':'trx',
    'Specialist':'tsp','Rx':'trx',
  };
  return`<span class="tag ${m[t]||'totc'}">${t}</span>`;
}
function stockTag(i){return i.qty<=i.minQty?'<span class="tag tlo">Low</span>':'<span class="tag tok">OK</span>';}

function expiryStatus(expiry){
  if(!expiry)return null;
  const [y,m]=expiry.split('-').map(Number);
  const exp=new Date(y,m-1,1);
  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.floor((exp-now)/(1000*60*60*24));
  if(days<0)return{label:'Expired',cls:'tlo',days};
  if(days<=30)return{label:'Expires in '+days+'d',cls:'tlo',days};
  if(days<=60)return{label:'Expires in '+Math.ceil(days/30)+'mo',cls:'am',days};
  return null;
}
function expiryTag(expiry){
  const s=expiryStatus(expiry);
  if(!s)return'';
  return`<span class="tag ${s.cls}" style="margin-left:4px">${s.label}</span>`;
}
const alertEl=()=>D.alert?`<div class="alert a${D.alert.k}">${esc(D.alert.msg)}</div>`:'';
function hl(s,q){if(!q)return esc(s);const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return esc(s).replace(r,'<mark>$1</mark>');}
function filteredInv(){const q=D.searchQ.toLowerCase().trim();if(!q)return D.inventory;return D.inventory.filter(i=>i.name.toLowerCase().includes(q)||i.type.toLowerCase().includes(q)||(i.supplier||'').toLowerCase().includes(q));}
function searchResults(){const q=D.searchQ.toLowerCase().trim();if(!q)return[];return D.inventory.filter(i=>i.name.toLowerCase().includes(q)||i.type.toLowerCase().includes(q)||(i.supplier||'').toLowerCase().includes(q)).slice(0,8);}

  const todM=myT.filter(t=>t.date===getToday());
  return`
    <div class="mc3">
      <div class="mk tl"><div class="ml">Today's sales</div><div class="mv" style="font-size:17px">${cur(todM.reduce((s,t)=>s+t.total,0))}</div><div class="ms" style="color:#1D9E75">${todM.length} sale(s)</div></div>
      <div class="mk gn"><div class="ml">Filtered period</div><div class="mv" style="font-size:17px">${cur(fil.reduce((s,t)=>s+t.total,0))}</div><div class="ms" style="color:#3B6D11">${fil.length} sale(s)</div></div>

        <select id="fdSel" style="padding:6px 10px;border:1.5px solid #9FE1CB;border-radius:7px;font-size:13px;font-weight:600">
          <option value="">All dates</option>${dates.map(d=>`<option value="${d}" ${fd===d?'selected':''}>${d}</option>`).join('')}
        </select>
        ${fd?`<button class="btn bsm btl" id="clrFd">Show all</button>`:''}

              </div></div>

              ${txns.map(t=>`<tr><td style="font-family:monospace;font-size:13px;color:#0F6E56;font-weight:700">${t.id}</td><td style="color:#666">${t.time||''}</td><td style="font-size:13px">${t.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td><td style="font-weight:700;color:#085041">${cur(t.total)}</td>
                <td style="display:flex;gap:5px"><button class="btn bsm bam" data-receipt="${t.id}">Receipt</button><button class="btn bsm bgr" data-print="${t.id}">Print</button></td></tr>`).join('')}
            </tbody></table></div></div>`;
        }).join('')}
    </div>`;

function buildEOD(date){
  const txns=D.transactions.filter(t=>t.date===date&&!t.voided);
  const allTxns=D.transactions.filter(t=>t.date===date);
  const voided=allTxns.filter(t=>t.voided);
  const total=txns.reduce((s,t)=>s+t.total,0);
  const itemMap={};
  txns.forEach(t=>t.items.forEach(i=>{
    if(!itemMap[i.name])itemMap[i.name]={name:i.name,qty:0,revenue:0};
    itemMap[i.name].qty+=i.qty;
    itemMap[i.name].revenue+=i.price*i.qty;
  }));
  const topItems=Object.values(itemMap).sort((a,b)=>b.revenue-a.revenue).slice(0,5);
  const staffMap={};
  txns.forEach(t=>{
    if(!staffMap[t.staff])staffMap[t.staff]={name:t.staff,sales:0,revenue:0};
    staffMap[t.staff].sales++;
    staffMap[t.staff].revenue+=t.total;
  });
  const staffPerf=Object.values(staffMap).sort((a,b)=>b.revenue-a.revenue);
  return{date,txns,voided,total,topItems,staffPerf,txnCount:txns.length};
}

function renderEOD(date){
  const r=buildEOD(date);
  if(!r.txnCount&&!r.voided.length) return`<div style="color:#888;font-size:14px;padding:8px 0">No transactions recorded for ${friendlyDate(date)}.</div>`;
  return`
    <div class="eod-card">
      <div style="font-weight:800;font-size:16px;color:#0C447C;margin-bottom:10px">📅 ${friendlyDate(date)}</div>
      <div class="eod-stat"><span>Total transactions</span><span>${r.txnCount}</span></div>
      ${r.voided.length?`<div class="eod-stat"><span>Voided transactions</span><span style="color:#791F1F">${r.voided.length}</span></div>`:''}
      <div class="eod-stat"><span>Total revenue</span><span style="color:#0F6E56">${cur(r.total)}</span></div>
    </div>
    ${r.topItems.length?`<div class="eod-card">
      <div style="font-weight:700;font-size:14px;color:#0C447C;margin-bottom:8px">🏆 Top selling items</div>
      ${r.topItems.map((i,n)=>`<div class="eod-stat"><span>${n+1}. ${esc(i.name)}</span><span>${i.qty} units · ${cur(i.revenue)}</span></div>`).join('')}
    </div>`:''}
    ${r.staffPerf.length?`<div class="eod-card">
      <div style="font-weight:700;font-size:14px;color:#0C447C;margin-bottom:8px">👥 Staff performance</div>
      ${r.staffPerf.map(s=>`<div class="eod-stat"><span>${esc(s.name)}</span><span>${s.sales} sale(s) · ${cur(s.revenue)}</span></div>`).join('')}
    </div>`:''}`;
}

function exportEODExcel(date){
  if(typeof XLSX==='undefined'){showAlert('Excel library loading…','aw');return;}
  const r=buildEOD(date);
  const wb=XLSX.utils.book_new();
  const ph=D.pharmacy||{};
  const sum=[
    [ph.name||"God's Will OTC"],['End-of-Day Report — '+friendlyDate(date)],['Generated: '+ts()],[],
    ['SUMMARY'],['Total transactions',r.txnCount],['Voided transactions',r.voided.length],['Total revenue (GH₵)',r.total],[],
    ['TOP SELLING ITEMS'],['Item','Units Sold','Revenue (GH₵)'],
    ...r.topItems.map(i=>[i.name,i.qty,i.revenue]),[],
    ['STAFF PERFORMANCE'],['Staff','Sales','Revenue (GH₵)'],
    ...r.staffPerf.map(s=>[s.name,s.sales,s.revenue]),
  ];
  const ws1=XLSX.utils.aoa_to_sheet(sum);
  ws1['!cols']=[{wch:30},{wch:15},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws1,'Summary');
  const txnRows=[['TXN ID','Time','Items','Total','Staff','Customer']];
  r.txns.forEach(t=>txnRows.push([t.id,t.time||'',t.items.map(i=>i.name+' ×'+i.qty).join(', '),t.total,t.staff,t.customer||'']));
  const ws2=XLSX.utils.aoa_to_sheet(txnRows);
  ws2['!cols']=[{wch:10},{wch:10},{wch:40},{wch:12},{wch:15},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws2,'Transactions');
  XLSX.writeFile(wb,'MediTrack_EOD_'+date+'.xlsx');
  addLog('EOD report exported',date);autoSave();
  showAlert('End-of-day report downloaded.','ok');
}

/* ════════════════════════════════════════
   EVENT BINDING
════════════════════════════════════════ */
function attachAll(){
  const $=id=>document.getElementById(id);
  const lb=$('loginBtn');
  if(lb)lb.onclick=()=>{
    const email=($('ln').value||'').trim();
    const p=$('lp').value||'';
    if(!email||!p){showAlert('Enter your email and password.','er');render();return;}
    lb.disabled=true; lb.textContent='Signing in…';
    auth.signInWithEmailAndPassword(email,p)
      .then(cred=>{
        D.logins.push({user:email,time:ts()});
        addLog('Login',email+' signed in');autoSave();
        startIdleTimer();
        const greet=timeGreeting();
        const h=new Date().getHours();
        const icon=h>=5&&h<12?'🌅':h>=12&&h<17?'☀️':'🌙';
        showAlert(icon+' '+greet+'! Welcome back.','ok');
        D.tab='dashboard';
        render();
      })
      .catch(e=>{
        showAlert('Incorrect email or password.','er');
        render();
      });
  };
  const fbtn=$('forgotBtn');
  if(fbtn)fbtn.onclick=()=>{D.forgotMode=true;D.forgotEmail='';D.alert=null;render();};
  const fpCancel=$('fpCancelBtn');
  if(fpCancel)fpCancel.onclick=()=>{D.forgotMode=false;D.forgotEmail='';D.alert=null;render();};
  const fpSend=$('fpSendBtn');
  if(fpSend)fpSend.onclick=()=>{
    const email=($('fpEmail').value||'').trim();
    if(!email){showAlert('Enter your email address.','er');render();return;}
    fpSend.disabled=true; fpSend.textContent='Sending…';
    auth.sendPasswordResetEmail(email)
      .then(()=>{
        showAlert('✅ If an account exists for that email, a reset link has been sent.','ok');
        D.forgotMode=false;
        render();
      })
      .catch(e=>{
        showAlert('✅ If an account exists for that email, a reset link has been sent.','ok');
        D.forgotMode=false;
        render();
      });
  };
  const lo=$('logoutBtn');
  if(lo)lo.onclick=()=>{
    addLog('Logout',D.user.name+' signed out');autoSave();
    stopIdleTimer();
    auth.signOut();
    D.tab='dashboard';D.cart=[];D.searchQ='';D.showSearch=false;render();
  };
  const menuBtn=$('menuBtn');
  if(menuBtn)menuBtn.onclick=(e)=>{
    e.stopPropagation();
    D.sidebarOpen=!D.sidebarOpen;
    const sb=document.getElementById('sidebar');
    const ov=document.getElementById('sidebar-overlay');
    if(sb)sb.classList.toggle('open',D.sidebarOpen);
    if(ov)ov.classList.toggle('open',D.sidebarOpen);
  };
  const ovEl=document.getElementById('sidebar-overlay');
  if(ovEl)ovEl.onclick=()=>{
    D.sidebarOpen=false;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  };
  document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{
    D.tab=b.dataset.stab;
    D.sidebarOpen=false;
    D.searchQ='';D.showSearch=false;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
    render();
  });
  const lbSide=$('logoutBtnSide');
  if(lbSide)lbSide.onclick=()=>{
    addLog('Logout',D.user.name+' signed out');autoSave();
    D.user=null;D.cart=[];D.tab='dashboard';D.sidebarOpen=false;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
    render();
  };
  document.querySelectorAll('[data-it]').forEach(t=>t.onclick=()=>{D.invTab=t.dataset.it;render();});
  document.querySelectorAll('[data-st]').forEach(t=>t.onclick=()=>{D.supTab=t.dataset.st;render();});
  const si=$('searchInput');
  if(si){
    si.oninput=function(){
      D.searchQ=this.value;D.showSearch=this.value.trim().length>0;
      const drop=$('searchDrop');const wrap=$('searchWrap');
      if(D.showSearch){
        const res=searchResults();const q=D.searchQ;
        const html=res.length===0?`<div class="sdnone">No results for "${esc(q)}"</div>`:
          res.map(i=>`<div class="sdi" data-sid="${i.id}" style="cursor:pointer">
            <div><div class="sdn">${hl(i.name,q)}</div><div class="sdm">${esc(i.type)} · Stock: <b>${i.qty}</b> · ${esc(i.supplier||'')}</div></div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
              <span class="sdp">${cur(i.price)}</span>
              ${D.tab==='sales'&&i.qty>0?`<button class="btn bsm btl" data-sadd="${i.id}">+ Add</button>`:''}
            </div>
          </div>`).join('');
        if(drop)drop.innerHTML=html;
        else if(wrap){const nd=document.createElement('div');nd.className='sdrop';nd.id='searchDrop';nd.innerHTML=html;wrap.appendChild(nd);}
        document.querySelectorAll('[data-sid]').forEach(el=>el.onclick=()=>{D.showSearch=false;D.tab='sales';render();});
        document.querySelectorAll('[data-sadd]').forEach(el=>el.onclick=ev=>{
          ev.stopPropagation();
          const id=+el.dataset.sadd;const item=D.inventory.find(i=>i.id===id);
          if(!item||item.qty===0){showAlert('Out of stock.','er');return;}
          const ex=D.cart.find(c=>c.id===id);
          if(ex){if(ex.qty<item.qty)ex.qty++;else{showAlert('Not enough stock.','er');return;}}
          else D.cart.push({...item,qty:1});
          D.showSearch=false;D.tab='sales';showAlert(item.name+' added.','ok');render();
        });
      }else{if(drop)drop.remove();}
    };
    si.onfocus=function(){if(D.searchQ.trim()){D.showSearch=true;si.oninput&&si.oninput.call(si);}};
    si.onkeydown=function(e){if(e.key==='Escape'){D.searchQ='';D.showSearch=false;render();}};
  }
  const sc=$('searchClear');if(sc)sc.onclick=()=>{D.searchQ='';D.showSearch=false;render();};
  document.addEventListener('click',function h(e){const w=document.getElementById('searchWrap');if(w&&!w.contains(e.target)){const d=document.getElementById('searchDrop');if(d){d.remove();D.showSearch=false;}document.removeEventListener('click',h);}});
  const cai=$('clearAllInvBtn');
  if(cai)cai.onclick=()=>{
    if(!confirm('⚠ Clear ALL inventory? Every medicine will be removed. Cannot be undone.'))return;
    if(!confirm('Final confirmation — all '+D.inventory.length+' medicines will be permanently deleted.'))return;
    D.inventory=[];D.nextId=1;addLog('Inventory cleared','All medicines removed');autoSave();
    showAlert('All inventory cleared.','ok');render();
  };
  const nn=$('nn');if(nn)nn.oninput=e=>{D.newMed.name=e.target.value;const v=e.target.value.toLowerCase().trim();D.dupWarn=v.length>2&&D.inventory.some(i=>i.name.toLowerCase().includes(v));};
  const an=$('addNew');
  if(an)an.onclick=()=>{
    const nm=($('nn').value||'').trim();
    const ty=D.invTypeFilter||MEDICINE_TYPES[0];
    const pr=parseFloat($('np').value);
    const qt=parseInt($('nq').value);
    const mn=parseInt($('nm').value);
    const sp=($('ns').value||'').trim();
    const ex=$('ne').value||'';
    const nt=($('no').value||'').trim();
    if(!nm){showAlert('Enter a product name.','er');render();return;}
    if(isNaN(pr)||pr<0){showAlert('Enter a valid price.','er');render();return;}
    if(isNaN(qt)||qt<0){showAlert('Enter a valid quantity.','er');render();return;}
    if(isNaN(mn)||mn<0){showAlert('Enter a min stock level.','er');render();return;}
    if(D.inventory.find(i=>i.name.toLowerCase()===nm.toLowerCase())){showAlert('"'+nm+'" already exists.','er');render();return;}
    D.inventory.push({id:D.nextId++,name:nm,type:ty,price:pr,qty:qt,minQty:mn,supplier:sp,expiry:ex,notes:nt});
    addLog('Added product',nm+' ('+ty+')');saveNow();
    D.newMed={name:'',type:ty,price:'',qty:'',minQty:'',supplier:'',expiry:'',notes:''};D.dupWarn=false;
    showAlert('"'+nm+'" added to '+ty+'.','ok');D.invTab='list';render();
  };
  const cn=$('clrNew');if(cn)cn.onclick=()=>{D.newMed={name:'',type:D.invTypeFilter||MEDICINE_TYPES[0],price:'',qty:'',minQty:'',supplier:'',expiry:'',notes:''};D.dupWarn=false;render();};
  document.querySelectorAll('[data-restock]').forEach(b=>b.onclick=()=>{
    const item=D.inventory.find(i=>i.id===+b.dataset.restock);
    const a=prompt('Restock "'+item.name+'" (current: '+item.qty+')\nQty to add:');
    const n=parseInt(a);if(!isNaN(n)&&n>0){item.qty+=n;addLog('Restock','"'+item.name+'" +'+n);saveNow();showAlert('+'+n+' added. Stock: '+item.qty,'ok');render();}
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{D.editItem={...D.inventory.find(i=>i.id===+b.dataset.edit)};render();});
  const se=$('saveEdit');
  if(se)se.onclick=()=>{
    const it=D.inventory.find(i=>i.id===D.editItem.id);
    it.name=$('en').value.trim()||it.name;
    it.type=$('et').value;
    it.price=parseFloat($('ep').value)||it.price;
    it.qty=parseInt($('eq').value)||0;
    it.minQty=parseInt($('em').value)||0;
    it.supplier=$('es').value.trim();
    it.expiry=$('ee').value;
    it.notes=($('en2')?.value||'').trim();
    addLog('Edited product',it.name+' ('+it.type+')');saveNow();
    D.editItem=null;showAlert('✅ Product updated.','ok');render();
  };
  const ce=$('cancelEdit');if(ce)ce.onclick=()=>{D.editItem=null;render();};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const it=D.inventory.find(i=>i.id===+b.dataset.del);
    if(confirm('Remove "'+it.name+'"?')){D.inventory=D.inventory.filter(i=>i.id!==+b.dataset.del);addLog('Removed',it.name);saveNow();showAlert('Removed.','ok');render();}
  });
  document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.ac,item=D.inventory.find(i=>i.id===id);
    const ex=D.cart.find(c=>c.id===id);
    if(ex){if(ex.qty<item.qty)ex.qty++;else{showAlert('Not enough stock.','er');render();return;}}
    else D.cart.push({...item,qty:1});render();
  });
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=+b.dataset.inc,item=D.inventory.find(i=>i.id===id),c=D.cart.find(c=>c.id===id);if(c.qty<item.qty)c.qty++;else showAlert('Not enough stock.','er');render();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=+b.dataset.dec,c=D.cart.find(c=>c.id===id);if(c.qty>1)c.qty--;else D.cart=D.cart.filter(x=>x.id!==id);render();});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{D.cart=D.cart.filter(c=>c.id!==+b.dataset.rm);render();});
  const cc=$('clrCart');if(cc)cc.onclick=()=>{D.cart=[];render();};
  const co=$('checkout');
  if(co)co.onclick=()=>{
    if(!D.cart.length){showAlert('Add items first.','er');render();return;}
    const today=getToday();
    const custInput=$('custName');
    const customer=(custInput?custInput.value:'').trim();
    const id='TXN'+String(D.nextTxn++).padStart(3,'0');
    const items=D.cart.map(c=>({name:c.name,qty:c.qty,price:c.price}));
    const total=parseFloat(D.cart.reduce((s,c)=>s+(c.price*c.qty),0).toFixed(2));
    D.cart.forEach(c=>{const inv=D.inventory.find(i=>i.id===c.id);if(inv)inv.qty-=c.qty;});
    D.transactions.push({id,date:today,time:hm(),items,total,staff:D.user.name,customer,voided:false});
    D.custName='';
    addLog('Sale completed',id+' '+cur(total)+' by '+D.user.name+(customer?' for '+customer:''));saveNow();
    D.cart=[];D.receipt=id;showAlert('Sale '+id+' recorded!','ok');render();
  };
  document.querySelectorAll('[data-itf]').forEach(b=>b.onclick=()=>{D.invTypeFilter=b.dataset.itf;render();});
  document.querySelectorAll('[data-stf]').forEach(b=>b.onclick=()=>{D.salesTypeFilter=b.dataset.stf;render();});
  const custNameEl=$('custName');if(custNameEl)custNameEl.oninput=()=>{D.custName=custNameEl.value;};
  document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{D.receipt=b.dataset.receipt;render();});
  const cr=$('closeR');if(cr)cr.onclick=()=>{D.receipt=null;render();};
  document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printReceipt(b.dataset.print));
  document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.void;
    const t=D.transactions.find(x=>x.id===id);if(!t)return;
    if(!confirm('Void transaction '+id+'?\nThis will return items to stock. Cannot be undone.'))return;
    t.voided=true;
    t.items.forEach(item=>{const inv=D.inventory.find(i=>i.name===item.name);if(inv)inv.qty+=item.qty;});
    addLog('Transaction voided',id+' by '+D.user.name);saveNow();
    showAlert('Transaction '+id+' voided and stock restored.','ok');render();
  });
  const reb=$('reorderExportBtn');if(reb)reb.onclick=()=>exportReorderExcel();
  const lsb=$('lowStockExportBtn');if(lsb)lsb.onclick=()=>exportReorderExcel();
  const sph=$('savePharmacy');
  if(sph)sph.onclick=()=>{
    const n=($('phName').value||'').trim();
    if(!n){showAlert('Pharmacy name cannot be empty.','er');return;}
    D.pharmacy={name:n,address:($('phAddr').value||'').trim(),phone:($('phPhone').value||'').trim(),email:($('phEmail').value||'').trim()};
    addLog('Pharmacy details updated',n);autoSave();showAlert('Pharmacy details saved. Receipts will now show "'+n+'".','ok');render();
  };
  const dmt=$('darkToggle');
  if(dmt)dmt.onchange=()=>{
    D.darkMode=dmt.checked;
    localStorage.setItem('mt_dark',D.darkMode?'1':'0');
    document.documentElement.classList.toggle('dark',D.darkMode);
    const tog=dmt.nextElementSibling;if(tog)tog.classList.toggle('on',D.darkMode);
  };
  const eodV=$('eodViewBtn');const eodE=$('eodExcelBtn');const eodP=$('eodPrintBtn');const eodD=$('eodDate');
  if(eodV)eodV.onclick=()=>{
    const date=(eodD?eodD.value:'')||getToday();D.reportDate=date;
    const rpt=$('eodReport');if(rpt)rpt.innerHTML=renderEOD(date);
  };
  if(eodE)eodE.onclick=()=>exportEODExcel((eodD?eodD.value:'')||getToday());
  if(eodP)eodP.onclick=()=>printEOD((eodD?eodD.value:'')||getToday());
  const obtn=$('openBarcode');
  if(obtn)obtn.onclick=()=>openBarcodeScanner();
  const cbtn=$('closeBarcodeBtn');
  if(cbtn)cbtn.onclick=()=>closeBarcodeScanner();
  const bsearch=$('barcodeSearch');
  if(bsearch){
    bsearch.oninput=()=>{
      const q=(bsearch.value||'').toLowerCase().trim();
      const sug=$('barcodeSuggestions');
      if(!sug)return;
      if(!q){sug.innerHTML='';return;}
      const matches=D.inventory.filter(i=>i.name.toLowerCase().includes(q)&&i.qty>0).slice(0,6);
      sug.innerHTML=matches.map(i=>`<div data-bac="${i.id}" style="padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:1px solid #eee">${esc(i.name)} — ${cur(i.price)} (${i.qty} in stock)</div>`).join('');
      sug.querySelectorAll('[data-bac]').forEach(b=>b.onclick=()=>{
        addToCart(+b.dataset.bac);
        closeBarcodeScanner();
        showAlert(b.textContent.split('—')[0].trim()+' added to cart.','ok');
        render();
      });
    };
  }
  document.querySelectorAll('[data-dayxl]').forEach(b=>b.onclick=()=>exportDayExcel(b.dataset.dayxl));
  document.querySelectorAll('[data-printday]').forEach(b=>b.onclick=()=>{
    const date=b.dataset.printday;const txns=D.transactions.filter(t=>t.date===date);
    if(!txns.length){showAlert('No transactions on '+date,'aw');return;}
    const pa=document.getElementById('pzone');pa.style.display='block';
    pa.innerHTML=`<div style="font-family:Arial,sans-serif;font-size:14px;max-width:720px;margin:0 auto">
      <div style="text-align:center;margin-bottom:18px"><div style="font-size:22px;font-weight:800">${D.pharmacy&&D.pharmacy.name?D.pharmacy.name:"God's Will OTC"}</div><div style="font-size:15px;font-weight:700;margin-top:4px">Daily Sales Report — ${friendlyDate(date)}</div><div style="font-size:13px;color:#555">Printed: ${ts()}</div></div>
      <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#E6F1FB"><th style="padding:8px;text-align:left;border-bottom:2px solid #185FA5">TXN ID</th><th style="padding:8px;border-bottom:2px solid #185FA5">Time</th><th style="padding:8px;border-bottom:2px solid #185FA5">Items</th><th style="padding:8px;text-align:right;border-bottom:2px solid #185FA5">Total</th><th style="padding:8px;border-bottom:2px solid #185FA5">Staff</th></tr></thead>
      <tbody>${txns.map(t=>`<tr><td style="padding:7px 8px;border-bottom:1px solid #eee;font-family:monospace">${t.id}</td><td style="padding:7px 8px;border-bottom:1px solid #eee">${t.time||''}</td><td style="padding:7px 8px;border-bottom:1px solid #eee">${t.items.map(i=>i.name+' ×'+i.qty).join(', ')}</td><td style="padding:7px 8px;border-bottom:1px solid #eee;text-align:right;font-weight:700">${cur(t.total)}</td><td style="padding:7px 8px;border-bottom:1px solid #eee">${t.staff}</td></tr>`).join('')}</tbody></table>
      <div style="margin-top:12px;text-align:right;font-size:15px;font-weight:800">Day total: ${cur(txns.reduce((s,t)=>s+t.total,0))}</div></div>`;
    setTimeout(()=>{window.print();setTimeout(()=>{pa.style.display='none';pa.innerHTML='';},500);},100);
    addLog('Day printed',date);autoSave();
  });
  const fds=$('fdSel');if(fds)fds.onchange=e=>{D.filterDate=e.target.value;render();};
  const cfd=$('clrFd');if(cfd)cfd.onclick=()=>{D.filterDate='';render();};
  const asb=$('addSupBtn');
  if(asb)asb.onclick=()=>{
    const nm=($('spName').value||'').trim(),ph=($('spPhone').value||'').trim(),em=($('spEmail').value||'').trim(),lo=($('spLoc').value||'').trim();
    if(!nm){showAlert('Enter supplier name.','er');render();return;}
    if(!ph){showAlert('Enter phone number.','er');render();return;}
    D.suppliers.push({id:D.nextSup++,name:nm,phone:ph,email:em,location:lo,products:[]});
    addLog('Supplier added',nm);saveNow();showAlert('"'+nm+'" added.','ok');D.supTab='list';render();
  };
  const csp=$('clrSup');if(csp)csp.onclick=()=>render();
  const rdb=$('recDelBtn');
  if(rdb)rdb.onclick=()=>{
    const supId=parseInt($('dlSupId').value);const invId=parseInt($('dlInvId').value);
    const type=$('dlType').value;
    const qty=parseInt($('dlQty').value);const cost=parseFloat($('dlCost').value);const date=$('dlDate').value;
    if(!supId){showAlert('Select a supplier.','er');render();return;}
    if(!invId){showAlert('Select a medicine.','er');render();return;}
    if(isNaN(qty)||qty<1){showAlert('Enter a valid quantity.','er');render();return;}
    if(isNaN(cost)||cost<0){showAlert('Enter a valid unit price.','er');render();return;}
    const sup=D.suppliers.find(s=>s.id===supId);const med=D.inventory.find(i=>i.id===invId);
    sup.products.push({invId,name:med.name,type,qtySupplied:qty,unitCost:cost,totalValue:parseFloat((qty*cost).toFixed(2)),date});
    med.qty+=qty;
    addLog('Delivery recorded',sup.name+' → '+qty+' × '+med.name);saveNow();
    showAlert(qty+' units of "'+med.name+'" from '+sup.name+' added to stock.','ok');D.supTab='list';render();
  };
  const xlsa=$('xlSupAllBtn');if(xlsa)xlsa.onclick=()=>exportSupplierExcel('all');
  document.querySelectorAll('[data-xlsup]').forEach(b=>b.onclick=()=>exportSupplierExcel(b.dataset.xlsup));
  document.querySelectorAll('[data-editsup]').forEach(b=>b.onclick=()=>{D.editSup={...D.suppliers.find(s=>s.id===+b.dataset.editsup)};render();});
  const sse=$('saveSupEdit');
  if(sse)sse.onclick=()=>{
    const s=D.suppliers.find(s=>s.id===D.editSup.id);
    s.name=$('esName').value.trim()||s.name;s.phone=$('esPhone').value.trim();s.email=$('esEmail').value.trim();s.location=$('esLoc').value.trim();
    addLog('Supplier edited',s.name);autoSave();D.editSup=null;showAlert('Supplier updated.','ok');render();
  };
  const cse=$('cancelSupEdit');if(cse)cse.onclick=()=>{D.editSup=null;render();};
  document.querySelectorAll('[data-delsup]').forEach(b=>b.onclick=()=>{
    const s=D.suppliers.find(s=>s.id===+b.dataset.delsup);
    if(confirm('Remove supplier "'+s.name+'"?')){D.suppliers=D.suppliers.filter(x=>x.id!==+b.dataset.delsup);addLog('Supplier removed',s.name);autoSave();showAlert('Removed.','ok');render();}
  });
  const pws=$('pwSave');
  if(pws)pws.onclick=()=>{
    const c=($('pwCur').value||'');const nw=($('pwNew').value||'').trim();const cn=($('pwCon').value||'').trim();
    if(!c){showAlert('Enter your current password.','er');render();return;}
    if(nw.length<6){showAlert('New password must be 6+ characters.','er');render();return;}
    if(nw!==cn){showAlert('Passwords do not match.','er');render();return;}
    pws.disabled=true;
    const cred=firebase.auth.EmailAuthProvider.credential(D.user.email,c);
    auth.currentUser.reauthenticateWithCredential(cred)
      .then(()=>auth.currentUser.updatePassword(nw))
      .then(()=>{addLog('Password changed',D.user.name);showAlert('Password updated.','ok');render();})
      .catch(e=>{showAlert(e.code==='auth/wrong-password'?'Current password incorrect.':'Could not update password: '+e.message,'er');render();});
  };
  const scb=$('showCreateStaff');
  if(scb)scb.onclick=()=>{
    const f=$('createStaffForm');
    if(f){f.style.display=f.style.display==='none'?'block':'none';}
  };
  const ccb=$('cancelCreateStaff');
  if(ccb)ccb.onclick=()=>{const f=$('createStaffForm');if(f)f.style.display='none';};
  const csb=$('createStaffBtn');
  if(csb)csb.onclick=()=>{
    const nm=($('newStaffName').value||'').trim();
    const email=($('newStaffEmail').value||'').trim();
    const role=($('newStaffRole').value||'staff');
    const pw=($('newStaffPass').value||'').trim();
    const pc=($('newStaffPassC').value||'').trim();
    if(!nm){showAlert('Enter a name for the account.','er');return;}
    if(!email){showAlert('Enter an email for the account.','er');return;}
    if(pw.length<6){showAlert('Password must be at least 6 characters.','er');return;}
    if(pw!==pc){showAlert('Passwords do not match.','er');return;}
    csb.disabled=true; csb.textContent='Creating…';
    const secondaryName='StaffCreate_'+Date.now();
    const secondaryApp=firebase.initializeApp(window._firebaseConfig,secondaryName);
    const secondaryAuth=secondaryApp.auth();
    secondaryAuth.createUserWithEmailAndPassword(email,pw)
      .then(cred=>{
        return window._accountsRef.doc(cred.user.uid).set({name:nm,role,email});
      })
      .then(()=>{
        addLog(role+' account created',nm+' ('+email+') by '+D.user.name);
        showAlert('✅ '+role.charAt(0).toUpperCase()+role.slice(1)+' account created for "'+nm+'".','ok');
        const f=$('createStaffForm');if(f)f.style.display='none';
        return secondaryAuth.signOut();
      })
      .catch(e=>{showAlert('Could not create account: '+e.message,'er');})
      .finally(()=>{secondaryApp.delete().catch(()=>{});csb.disabled=false;csb.textContent='Create account';render();});
  };
  document.querySelectorAll('[data-editstaff]').forEach(b=>b.onclick=()=>{
    const uid=b.dataset.editstaff;
    const u=USERS.find(x=>x.uid===uid);if(!u)return;
    const f=$('editStaffForm');const t=$('editStaffTitle');
    if(f){
      f.style.display='block';
      if(t)t.textContent='✏️ Edit — '+u.name;
      $('editStaffUid').value=uid;
      $('editStaffName').value=u.name;
      if($('editStaffRole'))$('editStaffRole').value=u.role||'staff';
      f.scrollIntoView({behavior:'smooth',block:'start'});
    }
  });
  const sse2=$('saveStaffEdit');
  if(sse2)sse2.onclick=()=>{
    const uid=($('editStaffUid').value||'').trim();
    const newName=($('editStaffName').value||'').trim();
    const newRole=($('editStaffRole').value||'staff');
    const u=USERS.find(x=>x.uid===uid);
    if(!u){showAlert('Staff not found.','er');return;}
    if(!newName){showAlert('Name cannot be empty.','er');return;}
    sse2.disabled=true;
    window._accountsRef.doc(uid).update({name:newName,role:newRole})
      .then(()=>{
        addLog('Staff account updated',u.name+(newName!==u.name?' → '+newName:'')+' by '+D.user.name);
        showAlert('✅ Updated "'+newName+'".','ok');
        const f=$('editStaffForm');if(f)f.style.display='none';
        render();
      })
      .catch(e=>{showAlert('Could not save: '+e.message,'er');render();});
  };
  const cse2=$('cancelStaffEdit');
  if(cse2)cse2.onclick=()=>{const f=$('editStaffForm');if(f)f.style.display='none';};
  document.querySelectorAll('[data-resetstaff]').forEach(b=>b.onclick=()=>{
    const email=b.dataset.resetstaff;
    if(!email){showAlert('No email on file for this account.','er');render();return;}
    auth.sendPasswordResetEmail(email)
      .then(()=>{showAlert('✅ Reset link sent to '+email+'.','ok');render();})
      .catch(e=>{showAlert('Could not send reset link: '+e.message,'er');render();});
  });
  document.querySelectorAll('[data-suspendstaff]').forEach(b=>b.onclick=()=>{
    const uid=b.dataset.suspendstaff;
    const u=USERS.find(x=>x.uid===uid);
    const blocked=D.blockedUsers||[];
    const isBlocked=blocked.includes(uid);
    if(isBlocked){
      D.blockedUsers=blocked.filter(n=>n!==uid);
      addLog('Account unsuspended',(u?u.name:uid)+' by '+D.user.name);
      showAlert('"'+(u?u.name:uid)+'" has been unsuspended. They can log in again.','ok');
    } else {
      D.blockedUsers=[...blocked,uid];
      addLog('Account suspended',(u?u.name:uid)+' by '+D.user.name);
      showAlert('"'+(u?u.name:uid)+'" suspended and will be logged out on all devices instantly.','ok');
    }
    saveAccountsUrgent();render();
  });
  [$('xlFullBtn'),$('xlFullBtn2')].forEach(b=>{if(b)b.onclick=exportFullExcel;});
  const clg=$('clrLog');if(clg)clg.onclick=()=>{if(confirm('Clear activity log?')){D.log=[];autoSave();showAlert('Log cleared.','ok');render();}};
  const ms=$('manSave');if(ms)ms.onclick=()=>{saveDB();addLog('Manual save');showAlert('Saved.','ok');render();};
  const rb=$('resetBtn');
  if(rb)rb.onclick=()=>{D.showResetDialog=true;D.resetStep=1;render();};
  const rc=$('resetCancel');
  if(rc)rc.onclick=()=>{D.showResetDialog=false;D.resetStep=1;render();};
  const rc1=$('resetConfirm1');
  if(rc1)rc1.onclick=()=>{D.resetStep=2;render();};
  const rc2=$('resetConfirm2');
  if(rc2)rc2.onclick=()=>{
    const pwd=($('resetPwd').value||'').trim();
    if(!pwd){showAlert('Enter your password.','er');render();return;}
    rc2.disabled=true;
    const cred=firebase.auth.EmailAuthProvider.credential(D.user.email,pwd);
    auth.currentUser.reauthenticateWithCredential(cred)
      .then(()=>{
        D.inventory=[];
        D.transactions=[];
        D.logins=[];
        D.log=[];
        D.suppliers=[];
        D.cart=[];
        D.nextId=1;D.nextTxn=1;D.nextSup=1;
        D.showResetDialog=false;D.resetStep=1;
        addLog('SYSTEM RESET','All data permanently wiped by '+D.user.name);
        saveDB();
        showAlert('✅ System reset complete. All data has been erased.','ok');
        D.tab='dashboard';render();
      })
      .catch(e=>{
        rc2.disabled=false;
        showAlert('Incorrect password — reset cancelled.','er');render();
      });
  };
}

/* ── Live clock ── */
function updateClock(){
  const now=new Date();
  const d=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const timeStr=friendlyDate(d)+' · '+fmt12hm(now);
  const el=document.getElementById('topClock');
  if(el) el.textContent=timeStr;
  const lc=document.getElementById('loginClock');
  if(lc) lc.textContent=timeStr;
}
setInterval(updateClock, 1000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) updateClock();
});
['click','keydown','mousemove'].forEach(ev=>{
  document.addEventListener(ev, updateClock, {passive:true});
});
window.addEventListener('focus', ()=>{
  if(db && window._docRef && D.dbLoaded){
    window._docRef.get().then(snap=>{
      if(snap.exists){
        applyCloudData(snap.data());
        if(D.user) render();
      }
    }).catch(e=>console.warn('Focus sync failed:',e));
  }
  updateClock();
});
updateClock();

/* ══════════════════════════════════════════════════════════
   FIX — prevent data loss when the browser is closed / the
   tab is backgrounded before an in-progress cloud save (Firestore
   write) has finished. This is what was causing newly-added
   inventory to "disappear" after fully quitting the browser and
   reopening the site: the write was still in flight and got
   killed when the page unloaded.
══════════════════════════════════════════════════════════ */
window.addEventListener('beforeunload', function(e){
  if (typeof D !== 'undefined' && D.saveStatus === 'saving') {
    clearTimeout(D._t);
    saveDB(); // force the pending write to fire immediately
    e.preventDefault();
    e.returnValue = 'Your changes are still saving — please wait a second before closing.';
    return e.returnValue;
  }
});

document.addEventListener('visibilitychange', function(){
  if (document.hidden && typeof D !== 'undefined' && D.saveStatus === 'saving') {
    clearTimeout(D._t);
    saveDB(); // flush any pending debounced save the instant the tab is backgrounded
  }
});

<script>
if('serviceWorker' in navigator){
  const swCode = `
const CACHE = 'meditrack-v11';
self.addEventListener('install', e => {
  // Don't pre-cache anything up front — just activate immediately.
  // We only want the cache as an OFFLINE FALLBACK, never as the
  // primary source, so there's nothing to eagerly warm here.
  e.waitUntil(self.skipWaiting());
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', e => {
  // NETWORK-FIRST: always try to fetch the latest version from the
  // internet first. Only fall back to a cached copy if the network
  // request fails (i.e. genuinely offline). This is the opposite of
  // the old cache-first strategy, which — once a device visited the
  // site a single time — would keep serving that exact frozen
  // snapshot forever, even after new versions were deployed. That
  // was why some devices kept showing old/blank data no matter what
  // was fixed and redeployed.
  e.respondWith(
    fetch(e.request).then(resp => {
      if(resp && resp.status === 200 && resp.type === 'basic'){
        const clone = resp.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return resp;
    }).catch(() => caches.match(e.request))
  );
});
`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL, {scope: '/'})
    .then(reg => console.log('SW registered', reg.scope))
    .catch(e => console.log('SW reg failed (normal for file://):', e));
}

let deferredPrompt = null;
const banner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();

  banner.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    if(outcome === 'accepted') banner.style.display = 'none';
    deferredPrompt = null;
  }
});

dismissBtn.addEventListener('click', () => {

});

}
